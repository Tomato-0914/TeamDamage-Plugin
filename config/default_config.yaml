# 插件默认设置，随插件更新，请勿修改
# 需要修改请在锅巴中设置，或在本目录新建 config.yaml，只写要修改的项

# 计算前是否发送提示信息（UID、队伍、手法、换装）；有换装警告时始终发送
sendTips: true
# 提示信息自动撤回的秒数，0 为不撤回（最长 120 秒）
tipsRecall: 5
# 结果图是否显示「伤害过程」表
showDamages: true
# 结果图是否显示「队伍与输出占比」面板
showAvatars: true
# 主 C（输出占比最高的角色）按 100% 暴击率计算，开启后每次计算会多请求一次小助手
mainCritFull: false
# 全队按 100% 暴击率计算（开启时主 C 满暴不再单独生效）
teamCritFull: false
# GCSim 可执行文件路径（#队伍模拟 使用），留空为插件目录下的 bin/gcsim（Windows 为 bin/gcsim.exe）
gcsimPath: ''
